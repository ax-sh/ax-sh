<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="-20 -100 120 120"
  width="260"
  height="260"
>
  <!-- Emoji -->
  <text x="40" y="90" font-size="70" text-anchor="middle">&#x1F44B;</text>
  <!-- Unicode for waving hand emoji -->

  <!-- Animation: Rotate the emoji -->
  <animateTransform
    attributeName="transform"
    type="rotate"
    values="0 30 30; 20 30 30; 10 30 30; 20 30 30; 0 30 30"
    dur="1.9s"
    repeatCount="indefinite"
  />

  <!-- To change the speed of the animation: change the value of `dur` in the line above -->
</svg>
